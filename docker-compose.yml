services:
  postgres:
    image: postgres:17
    container_name: adorbit-auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    networks:
      adorbit-network:
        aliases:
          - auth-postgres
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  auth:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: adorbit-auth
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@auth-postgres:5432/${POSTGRES_DB}?sslmode=disable"
      APP_PORT: "${APP_PORT:-8080}"
    ports:
      - "${AUTH_HOST_PORT:-8081}:${APP_PORT:-8080}"
    volumes:
      - .:/app
      - /app/tmp
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - adorbit-network

volumes:
  auth_postgres_data:

networks:
  adorbit-network:
    external: true
    name: adorbit-network
