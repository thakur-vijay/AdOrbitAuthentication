basePath: /api/v1
definitions:
  auth.APIErrorResponse:
    properties:
      message:
        type: string
      status_code:
        type: integer
    type: object
  auth.APIResponse:
    properties:
      data: {}
      message:
        type: string
      status_code:
        type: integer
    type: object
  auth.LoginRequestDTO:
    properties:
      email:
        type: string
      password:
        type: string
      role:
        enum:
        - advertiser
        - publisher
        type: string
    required:
    - email
    - password
    - role
    type: object
  auth.LoginResponseDTO:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/auth.LoginUserDTO'
    type: object
  auth.LoginUserDTO:
    properties:
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: string
      is_email_verified:
        type: boolean
      role:
        type: string
      updated_at:
        type: string
    type: object
  auth.RefreshTokenRequestDTO:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  auth.RefreshTokenResponseDTO:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  auth.ResendOTPDTO:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  auth.SignupRequestDTO:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        type: string
      role:
        enum:
        - advertiser
        - publisher
        type: string
    required:
    - email
    - full_name
    - password
    - role
    type: object
  auth.VerifyOTPDTO:
    properties:
      email:
        type: string
      otp:
        type: string
      role:
        enum:
        - advertiser
        - publisher
        type: string
    required:
    - email
    - otp
    - role
    type: object
host: localhost:8081
info:
  contact: {}
  description: Authentication service for AdOrbit.
  title: AdOrbit Authentication API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: |-
        Authenticates a user using email and password.
        Returns authentication tokens when email verification is complete.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequestDTO'
      produces:
      - application/json
      responses:
        "202":
          description: Authentication accepted
          schema:
            allOf:
            - $ref: '#/definitions/auth.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.LoginResponseDTO'
              type: object
        "400":
          description: Invalid request or validation failure
          schema:
            $ref: '#/definitions/auth.APIErrorResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/auth.APIErrorResponse'
        "403":
          description: Email verification required or account disabled
          schema:
            $ref: '#/definitions/auth.APIErrorResponse'
        "409":
          description: Account conflict
          schema:
            $ref: '#/definitions/auth.APIErrorResponse'
        "413":
          description: Request body exceeds the configured limit
          schema:
            $ref: '#/definitions/auth.APIErrorResponse'
        "415":
          description: Content-Type must be application/json
          schema:
            $ref: '#/definitions/auth.APIErrorResponse'
        "429":
          description: Too many login attempts
          schema:
            $ref: '#/definitions/auth.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/auth.APIErrorResponse'
      summary: Authenticate a user
      tags:
      - Authentication
  /auth/logout:
    post:
      description: Invalidates the authenticated user's active session.
      produces:
      - application/json
      responses:
        "200":
          description: Logged out successfully
          schema:
            $ref: '#/definitions/auth.APIResponse'
        "401":
          description: Missing, invalid, or expired access token
          schema:
            $ref: '#/definitions/auth.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/auth.APIErrorResponse'
      security:
      - BearerAuth: []
      summary: Log out the authenticated user
      tags:
      - Authentication
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: |-
        Exchanges a valid refresh token for a new access token and refresh token.
        Requires a valid access token to identify the caller role; the submitted refresh token is validated separately.
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshTokenRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Tokens refreshed successfully
          schema:
            allOf:
            - $ref: '#/definitions/auth.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.RefreshTokenResponseDTO'
              type: object
        "400":
          description: Invalid request or missing refresh token
          schema:
            $ref: '#/definitions/auth.APIErrorResponse'
        "401":
          description: Missing or invalid access token, or invalid refresh token
          schema:
            $ref: '#/definitions/auth.APIErrorResponse'
        "409":
          description: Refresh token rotation conflict
          schema:
            $ref: '#/definitions/auth.APIErrorResponse'
        "413":
          description: Request body exceeds the configured limit
          schema:
            $ref: '#/definitions/auth.APIErrorResponse'
        "415":
          description: Content-Type must be application/json
          schema:
            $ref: '#/definitions/auth.APIErrorResponse'
        "429":
          description: Too many refresh attempts
          schema:
            $ref: '#/definitions/auth.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/auth.APIErrorResponse'
      security:
      - BearerAuth: []
      summary: Refresh authentication tokens
      tags:
      - Authentication
  /auth/resendOTP:
    post:
      consumes:
      - application/json
      description: |-
        Generates and sends a new email verification OTP.
        Requests are subject to resend cooldown and rate limiting.
      parameters:
      - description: Email address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.ResendOTPDTO'
      produces:
      - application/json
      responses:
        "201":
          description: OTP sent successfully
          schema:
            $ref: '#/definitions/auth.APIResponse'
        "400":
          description: Invalid request or email format
          schema:
            $ref: '#/definitions/auth.APIErrorResponse'
        "404":
          description: Account not found
          schema:
            $ref: '#/definitions/auth.APIErrorResponse'
        "409":
          description: Email already verified or resend cooldown active
          schema:
            $ref: '#/definitions/auth.APIErrorResponse'
        "413":
          description: Request body exceeds the configured limit
          schema:
            $ref: '#/definitions/auth.APIErrorResponse'
        "415":
          description: Content-Type must be application/json
          schema:
            $ref: '#/definitions/auth.APIErrorResponse'
        "429":
          description: Too many OTP requests
          schema:
            $ref: '#/definitions/auth.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/auth.APIErrorResponse'
      summary: Resend email verification OTP
      tags:
      - Authentication
  /auth/signup:
    post:
      consumes:
      - application/json
      description: |-
        Creates a new advertiser or publisher account and initiates email verification.
        Requires an Idempotency-Key to safely handle retries.
      parameters:
      - description: Unique UUID for request idempotency
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Signup details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.SignupRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: User created successfully
          schema:
            allOf:
            - $ref: '#/definitions/auth.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.LoginResponseDTO'
              type: object
        "400":
          description: Invalid request or missing idempotency key
          schema:
            $ref: '#/definitions/auth.APIErrorResponse'
        "409":
          description: Email already registered or idempotency conflict
          schema:
            $ref: '#/definitions/auth.APIErrorResponse'
        "413":
          description: Request body exceeds the configured limit
          schema:
            $ref: '#/definitions/auth.APIErrorResponse'
        "415":
          description: Content-Type must be application/json
          schema:
            $ref: '#/definitions/auth.APIErrorResponse'
        "422":
          description: Validation failed
          schema:
            $ref: '#/definitions/auth.APIErrorResponse'
        "429":
          description: Rate limit exceeded
          schema:
            $ref: '#/definitions/auth.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/auth.APIErrorResponse'
      summary: Register a new user
      tags:
      - Authentication
  /auth/verifyOTP:
    post:
      consumes:
      - application/json
      description: |-
        Verifies the email address using the OTP sent during registration.
        Successfully verifying the OTP completes email verification and returns authentication tokens.
        Requires an Idempotency-Key to safely handle retries.
      parameters:
      - description: Unique UUID for request idempotency
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Email address and verification OTP
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.VerifyOTPDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Email verified successfully
          schema:
            allOf:
            - $ref: '#/definitions/auth.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.LoginResponseDTO'
              type: object
        "400":
          description: Invalid request, OTP format, or missing idempotency key
          schema:
            $ref: '#/definitions/auth.APIErrorResponse'
        "401":
          description: Invalid or expired OTP
          schema:
            $ref: '#/definitions/auth.APIErrorResponse'
        "404":
          description: Account or OTP not found
          schema:
            $ref: '#/definitions/auth.APIErrorResponse'
        "409":
          description: OTP already consumed or idempotency conflict
          schema:
            $ref: '#/definitions/auth.APIErrorResponse'
        "413":
          description: Request body exceeds the configured limit
          schema:
            $ref: '#/definitions/auth.APIErrorResponse'
        "415":
          description: Content-Type must be application/json
          schema:
            $ref: '#/definitions/auth.APIErrorResponse'
        "422":
          description: Validation failed
          schema:
            $ref: '#/definitions/auth.APIErrorResponse'
        "429":
          description: Too many verification attempts
          schema:
            $ref: '#/definitions/auth.APIErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/auth.APIErrorResponse'
      summary: Verify email address using OTP
      tags:
      - Authentication
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: Enter your JWT token with Bearer prefix.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
